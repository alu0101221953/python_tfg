<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">    
    <style>
    :root {
        --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;
        --accent:#7c6af7;--accent2:#4fc3f7;--ok:#4caf7d;--fail:#f06292;
        --text:#e8eaf0;--muted:#6b7080;
        --mono:'JetBrains Mono',monospace;--sans:'DM Sans',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);
        min-height:100vh;display:flex;flex-direction:column}
    
    /* Topbar */
    .topbar{display:flex;align-items:center;justify-content:space-between;
        padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
    .logo{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--accent)}
    .topbar-right{display:flex;align-items:center;gap:16px}
    .alumno-badge{background:var(--border);padding:4px 12px;border-radius:20px;
        font-size:13px;color:var(--muted)}
    .btn-sm{background:transparent;border:1px solid var(--border);color:var(--muted);
        padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;
        transition:all .2s;font-family:var(--sans)}
    .btn-sm:hover{border-color:var(--accent);color:var(--accent)}

    /* Layout */
    .main{flex:1}
 
    /* Card */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px}

    /* Loading */
    .loading{display:flex;flex-direction:column;align-items:center;
        justify-content:center;min-height:200px;gap:12px}
    .spinner{width:32px;height:32px;border:2px solid var(--border);
        border-top-color:var(--accent);border-radius:50%;
        animation:spin .7s linear infinite}
    .loading-text{font-size:13px;color:var(--muted)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast.penalty{border-color:var(--fail);color:var(--fail);background:rgba(240,98,146,.06)}
    .hints-wrap{margin-bottom:16px}
    .btn-hint{background:transparent;border:1px dashed var(--accent2);color:var(--accent2);padding:8px 16px;
        border-radius:8px;font-family:var(--sans);font-size:12px;cursor:pointer;transition:all .2s;display:block;width:100%}
    .btn-hint:hover:not([disabled]){background:rgba(79,195,247,.08)}
    .btn-hint[disabled]{opacity:.35;cursor:default}
    .pista-mostrada{background:rgba(79,195,247,.06);border-left:3px solid var(--accent2);color:var(--accent2);
        padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:8px;line-height:1.5}
    .toasts-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
    .toast{background:var(--surface);border:1px solid var(--accent);color:var(--accent);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--sans);animation:toastIn .3s ease,toastOut .3s ease 2.2s forwards}
    .toast.insignia{border-color:#ffd54f;color:#ffd54f;background:rgba(255,213,79,.08)}
    @keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
    @keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

    /* Layout con sidebar */
    .layout{display:grid;grid-template-columns:1fr 260px;gap:20px;max-width:1100px;margin:0 auto;width:100%;padding:28px 24px}

    /* Sidebar BKT */
    .sidebar{display:flex;flex-direction:column;gap:12px}
    .bkt-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
    .bkt-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px}
    .bkt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .bkt-name{font-size:12px;color:var(--text);width:80px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bkt-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
    .bkt-bar{height:100%;border-radius:3px;transition:width .5s ease}
    .bkt-pct{font-family:var(--mono);font-size:11px;color:var(--muted);width:30px;text-align:right;flex-shrink:0}
    .bkt-dom{font-size:10px;color:var(--ok);width:12px;flex-shrink:0}
    .bkt-empty{font-size:12px;color:var(--muted);text-align:center;padding:8px 0}

    /* Badges */
    .ex-meta{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
    .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;
        text-transform:uppercase;letter-spacing:.5px}
    .badge-cat{background:rgba(79,195,247,.15);color:var(--accent2);border:1px solid rgba(79,195,247,.25)}
    .badge-nivel{background:rgba(124,106,247,.15);color:var(--accent);border:1px solid rgba(124,106,247,.25)}
    .badge-tipo{background:rgba(76,175,125,.1);color:var(--ok);border:1px solid rgba(76,175,125,.2)}
 
    /* Enunciado y código */
    .ex-enunciado{font-size:16px;line-height:1.6;margin-bottom:18px}
    .code-block{background:#0a0c12;border:1px solid var(--border);border-radius:8px;
        padding:18px 20px;margin-bottom:20px;overflow-x:auto}
    .code-block pre{font-family:var(--mono);font-size:13.5px;line-height:1.7;white-space:pre}
    .kw{color:#ff79c6}.fn{color:#8be9fd}.str{color:#f1fa8c}
    .num{color:#bd93f9}.cm{color:#6272a4;font-style:italic}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* Opciones múltiples */
    .options-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
    .option-btn{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:12px 16px;cursor:pointer;text-align:left;
        font-family:var(--mono);font-size:13px;color:var(--text);transition:all .18s;display:flex;align-items:center;gap:10px}
    .option-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(124,106,247,.08)}
    .option-btn.selected { border-color: var(--accent); background: rgba(124,106,247,.12); }
    .option-btn.correct { border-color: var(--ok);   background: rgba(76,175,125,.12);  color: var(--ok); }
    .option-btn.wrong { border-color: var(--fail);  background: rgba(240,98,146,.08); color: var(--fail); }
    .option-btn:disabled { cursor: default; }
    .fill-input.correct { border-color: var(--ok); }
    .fill-input.wrong { border-color: var(--fail); }
    .option-idx{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);
        display:flex;align-items:center;justify-content:center;
        font-size:11px;color:var(--muted);flex-shrink:0}
    
    /* Feedback */
    .feedback-panel {margin-top: 20px;padding: 16px 20px;border-radius: 8px;border-left: 3px solid transparent;display: none;animation: fadeIn .3s ease;}
    .feedback-panel.show  { display: block; }
    .feedback-panel.ok    { background: rgba(76,175,125,.08);  border-color: var(--ok); }
    .feedback-panel.fail  { background: rgba(240,98,146,.06);  border-color: var(--fail); }
    .feedback-titulo      { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .feedback-panel.ok   .feedback-titulo { color: var(--ok); }
    .feedback-panel.fail .feedback-titulo { color: var(--fail); }
    .feedback-texto { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .feedback-pista { font-size: 13px; color: var(--accent2); margin-top: 8px; font-style: italic; }
    .feedback-motiv { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .btn-siguiente {margin-top: 14px;background: transparent;border: 1px solid var(--accent);color: var(--accent);padding: 9px 22px;
        border-radius: 8px;cursor: pointer;font-family: var(--sans);font-size: 14px;font-weight: 600;transition: all .2s;display: none;}
    .btn-siguiente.show  { display: inline-block; }
    .btn-siguiente:hover { background: rgba(124,106,247,.12); }

    /* Input completar código */
    .fill-area  { margin-bottom: 20px; }
    .fill-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .fill-input {
        width: 100%;background: #0a0c12;border: 1px solid var(--border);border-radius: 8px;padding: 12px 16px;font-family: var(--mono);
        font-size: 14px;color: var(--text);outline: none;transition: border-color .2s;}
    .fill-input:focus { border-color: var(--accent); }

    /* Selector de indentación */
    .indent-area { margin-bottom: 20px; }
    .indent-btns { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
    .indent-btn {background: rgba(255,255,255,.03);border: 1px solid var(--border);border-radius: 8px;padding: 7px 14px;
        cursor: pointer;font-family: var(--mono);font-size: 12px;color: var(--muted);transition: all .18s;}
    .indent-btn:hover  { border-color: var(--accent); color: var(--accent); }
    .indent-btn.active { border-color: var(--accent); background: rgba(124,106,247,.12); color: var(--accent); font-weight: 600; }
    .indent-preview {background: #0a0c12;border: 1px solid var(--border);border-radius: 8px;padding: 11px 16px;font-family: var(--mono);
        font-size: 13px;min-height: 40px;margin-bottom: 12px;}

    /* Botón comprobar */
    .btn-responder{background:var(--accent);color:#fff;border:none;padding:11px 26px;border-radius:8px;font-family:var(--sans);font-size:14px;font-weight:600;
        cursor:pointer;transition:all .2s;margin-top:4px}
    .btn-responder:hover:not(:disabled){background:#6b59e8;transform:translateY(-1px)}
    .btn-responder:disabled{opacity:.4;cursor:default;transform:none}
    </style>
</head>
<body>
    <div class="topbar">
        <span class="logo">TFG</span>
        <div class="topbar-right">
            <span class="alumno-badge" id="alumno-nombre">Cargando...</span>
            <div class="stat">
                <div class="stat-val" id="stat-puntos">0</div>
                <div class="stat-lbl">Puntos</div>
            </div>
            <div class="racha-badge off" id="racha-badge">
                🔥 <span id="racha-num">0</span>
            </div>
            <button class="btn-sm" onclick="location.href='/dashboard?id_alumno='+ID_ALUMNO">Mi progreso</button>
            <button class="btn-sm" onclick="location.href='/'">Salir</button>
        </div>
    </div>
    
    <div class="main">
        <div class="layout">
            <div class="card" id="ejercicio-card">
                <div class="loading" id="loading-state">
                    <div class="spinner"></div>
                    <div class="loading-text">Cargando ejercicio...</div>
                </div>
                <div id="ejercicio-content" style="display:none"></div>
            </div>
            <div class="sidebar">
                <div class="bkt-card">
                    <div class="bkt-title">Progreso por categoría</div>
                    <div id="bkt-rows">
                        <div class="bkt-empty">Responde ejercicios<br>para ver tu progreso</div>
                    </div>
                </div>
            </div>
        </div>
    </div>  

    <div class="toasts-wrap" id="toasts-wrap"></div>

    <script>
        const ID_ALUMNO = new URLSearchParams(location.search).get('id_alumno') || '';
        const CAT_NOMBRES = {
            1:'Sintaxis', 2:'Indentación', 3:'Variables', 4:'Condicionales',
            5:'Bucles', 6:'Funciones', 7:'Listas', 8:'Otros'
        };
        let preguntaActual = null;
        let respuestaSeleccionada = null;
        let tiempoInicio = null;
        let pistasUsadas = 0;
        let pistasDisponibles = [];

        window.addEventListener('DOMContentLoaded', async () => {
            if (!ID_ALUMNO) { location.href = '/'; return; }
            await cargarPerfil();
            await cargarSiguienteEjercicio();
        });

        async function cargarPerfil() {
            try {
                const res = await fetch(`/api/dashboard/${ID_ALUMNO}`);
                if (!res.ok) { location.href = '/'; return; }
                const d = await res.json();
                document.getElementById('alumno-nombre').textContent = d.nombre;
                if (d.gamificacion) actualizarTopbar(d.gamificacion);
            } catch(e) { console.error(e); }
        }

        async function cargarSiguienteEjercicio() {
            mostrarLoading(true);
            try {
                const res  = await fetch(`/api/ejercicio/siguiente?id_alumno=${ID_ALUMNO}`);
                if (res.status === 404) { location.href = '/'; return; }
                const data = await res.json();
                if (data.fin_banco) { mostrarFin(data.mensaje); return; }
                preguntaActual = data;
                respuestaSeleccionada = null;
                tiempoInicio = Date.now();
                renderizarEjercicio(data);
            } catch(e) { console.error(e); }
            finally { mostrarLoading(false); }
        }

        function renderizarEjercicio(p) {
            const esPrediccion = p.tipo === 'prediccion_output';
            pistasUsadas      = 0;
            pistasDisponibles = p.pistas || [];
            const cont = document.getElementById('ejercicio-content');
            cont.innerHTML = `
                <div class="ex-meta">
                    <span class="badge badge-cat">${CAT_NOMBRES[p.categoria] || 'Cat ' + p.categoria}</span>
                    <span class="badge badge-nivel">${p.nivel}</span>
                    <span class="badge badge-tipo">${esPrediccion ? 'Predecir output' : 'Completar código'}</span>
                </div>
                <div class="ex-enunciado">${p.enunciado}</div>
                ${p.codigo ? `<div class="code-block"><pre>${
                    p.tipo === 'completar_codigo'
                        ? resaltarHueco(resaltarSintaxis(p.codigo))
                        : resaltarSintaxis(p.codigo)
                }</pre></div>` : ''}
                ${esPrediccion ? renderOpciones(p.opciones) : renderCompletarCodigo(p)}
                ${pistasDisponibles.length ? `<div class="hints-wrap" id="hints-wrap">
                    <div id="pistas-mostradas"></div>
                    <button class="btn-hint" id="btn-hint" onclick="verPista()"></button>
                </div>` : ''}
                <button class="btn-responder" id="btn-responder" onclick="enviarRespuesta()" disabled>
                    Comprobar
                </button>
                <div class="feedback-panel" id="feedback-panel">
                    <div class="feedback-titulo" id="feedback-titulo"></div>
                    <div class="feedback-texto"  id="feedback-texto"></div>
                    <div class="feedback-pista"  id="feedback-pista" style="display:none"></div>
                    <div class="feedback-motiv"  id="feedback-motiv"></div>
                    <button class="btn-siguiente" id="btn-siguiente"
                            onclick="cargarSiguienteEjercicio()">
                        Siguiente ejercicio →
                    </button>
                </div>
            `;
            cont.style.display = 'block';
            actualizarBotonPista();
        }
        function escaparHtml(t) {
            return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
        function renderOpciones(opciones) {
            if (!opciones?.length) return '';
            return `<div class="options-grid" id="options-grid">
                ${opciones.map((op, i) => {
                    const opHtml = op.includes('\n')
                        ? op.split('\n').map(l => `<span style="display:block">${escaparHtml(l) || '&nbsp;'}</span>`).join('')
                        : escaparHtml(op);
                    return `<button class="option-btn" id="opt-${i}" onclick="seleccionarOpcion(${i})">
                        <span class="option-idx">${String.fromCharCode(65 + i)}</span>
                        <code style="font-family:var(--mono);font-size:13px;text-align:left">${opHtml}</code>
                    </button>`;
                }).join('')}
            </div>`;
        }

        function renderCompletarCodigo(p) {
            if (p.categoria === 2) {
                return `<div class="indent-area">
                    <div class="fill-label">Selecciona la indentación correcta para la línea marcada:</div>
                    <div class="indent-btns">
                        <button class="indent-btn" onclick="seleccionarIndent(0)">Sin indentación</button>
                        <button class="indent-btn" onclick="seleccionarIndent(1)">1 nivel (4 espacios)</button>
                        <button class="indent-btn" onclick="seleccionarIndent(2)">2 niveles (8 espacios)</button>
                        <button class="indent-btn" onclick="seleccionarIndent(3)">3 niveles (12 espacios)</button>
                    </div>
                    <div class="fill-label">Vista previa:</div>
                    <div class="indent-preview" id="indent-preview" style="color:var(--muted)">
                        — Selecciona un nivel —
                    </div>
                    <input type="hidden" id="fill-input" value="">
                </div>`;
            }
            return `<div class="fill-area">
                <div class="fill-label">Escribe lo que va en el hueco:</div>
                <input class="fill-input" id="fill-input" type="text" placeholder="Tu respuesta..."
                       onkeydown="if(event.key==='Enter') enviarRespuesta()"
                       oninput="document.getElementById('btn-responder').disabled = !this.value.trim()">
            </div>`;
        }

        async function enviarRespuesta() {
            if (!preguntaActual) return;
            const tiempo = Math.round((Date.now() - tiempoInicio) / 1000);
            let respuesta = respuestaSeleccionada;
            if (preguntaActual.tipo === 'completar_codigo') {
                const val = document.getElementById('fill-input')?.value || '';
                respuesta = preguntaActual.categoria === 2 ? val : val.trim();
                if (!respuesta.trim()) return;
            }
            if (!respuesta && respuesta !== '0') return;
            document.getElementById('btn-responder').disabled = true;
            try {
                const res  = await fetch('/api/ejercicio/responder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_alumno:   ID_ALUMNO,
                        id_pregunta: preguntaActual.id,
                        respuesta,
                        tiempo,
                        pistas_usadas: pistasUsadas,
                    }),
                });
                const data = await res.json();
                mostrarFeedback(data.feedback);
                marcarOpcion(data.feedback.correcta, respuesta);
                if (data.siguiente_pregunta) preguntaActual = data.siguiente_pregunta;
                if (data.bkt) actualizarBKT(data.bkt);
                if (data.gamificacion) actualizarTopbar(data.gamificacion);
                if (data.eventos) mostrarEventos(data.eventos);
            } catch(e) {
                console.error(e);
                document.getElementById('btn-responder').disabled = false;
            }
        }

        function verPista() {
            if (pistasUsadas >= pistasDisponibles.length) return;
            const texto = pistasDisponibles[pistasUsadas];
            pistasUsadas++;
            const div = document.createElement('div');
            div.className = 'pista-mostrada';
            div.textContent = '💡 ' + texto;
            document.getElementById('pistas-mostradas').appendChild(div);
            actualizarBotonPista();
        }

        function actualizarBotonPista() {
            const btn = document.getElementById('btn-hint');
            if (!btn) return;
            if (pistasUsadas >= pistasDisponibles.length) {
                btn.style.display = 'none';
                return;
            }
            const costo = pistasUsadas + 1;
            btn.textContent = '💡 Ver pista ' + (pistasUsadas + 1) + '/' + pistasDisponibles.length + ' (-' + costo + ' pt' + (costo > 1 ? 's' : '') + ')';
            btn.style.display = 'block';
        }

        function seleccionarOpcion(idx) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(`opt-${idx}`)?.classList.add('selected');
            respuestaSeleccionada = String(idx);
            document.getElementById('btn-responder').disabled = false;
        }

        function seleccionarIndent(niveles) {
            const lineaHueco = (preguntaActual?.codigo || '').split('\n').find(l => l.includes('___')) || '';
            const cuerpo = lineaHueco.replace('___', '').trim();
            const valor = '    '.repeat(niveles) + cuerpo;
            document.querySelectorAll('.indent-btn').forEach((b, i) =>
                b.classList.toggle('active', i === niveles));
            document.getElementById('indent-preview').innerHTML =
                `<span style="color:var(--accent2)">${'·'.repeat(niveles * 4)}</span>${cuerpo}`;
            document.getElementById('fill-input').value = valor;
            document.getElementById('btn-responder').disabled = !cuerpo;
        }

        const INSIGNIA_NOMBRES = {
            'primer_acierto': '🏅 ¡Primer acierto!',
            'racha_3': '🔥 ¡Racha de 3!',
            'racha_5': '🔥 ¡Racha de 5!',
            'racha_10': '🔥 ¡Racha de 10!',
            'sin_pistas_5': '🧠 ¡5 sin pistas!',
            'velocista_3': '⚡ ¡Velocista!',
            'perseverante_3':'💪 ¡Perseverante!',
            'nivel_2': '⬆️ ¡Nivel 2!',
            'nivel_5': '⬆️ ¡Nivel 5!',
            'nivel_10': '⬆️ ¡Nivel 10!',
            '10_correctas': '✅ ¡10 correctas!',
            '25_correctas': '✅ ¡25 correctas!',
            '50_correctas': '✅ ¡50 correctas!',
        };

        function mostrarEventos(eventos) {
            const wrap = document.getElementById('toasts-wrap');
            eventos.forEach((ev, i) => {
                setTimeout(() => {
                    const toast = document.createElement('div');
                    const esInsignia = ev.startsWith('insignia:');
                    toast.className = 'toast' + (esInsignia ? ' insignia' : '');
                    if (esInsignia) {
                        const nombre = ev.replace('insignia:', '');
                        const cat = nombre.match(/domina_cat_(\d+)/);
                        const CATS = {1:'Sintaxis',2:'Indentación',3:'Variables',4:'Condicionales',5:'Bucles',6:'Funciones',7:'Listas',8:'Otros'};
                        toast.textContent = cat
                            ? `🏆 ¡Dominas ${CATS[cat[1]] || 'la categoría'}!`
                            : (INSIGNIA_NOMBRES[nombre] || `🏅 ${nombre}`);
                    } else if (ev.startsWith('pistas:')) {
                        toast.classList.add('penalty');
                        toast.textContent = '💡 ' + ev.replace('pistas:', '') + ' puntos (pistas)';
                    } else if (ev.startsWith('velocidad:')) {
                        toast.textContent = '⚡ +2 pts (respuesta rápida)';
                    } else if (ev.startsWith('dificultad:')) {
                        toast.textContent = '💪 +5 pts (categoría difícil)';
                    } else if (ev.startsWith('desglose:')) {
                        const partes = ev.replace('desglose:', '').split(' | ');
                        const total = partes.pop();
                        const wrap2 = document.getElementById('feedback-desglose');
                        if (wrap2) {
                            wrap2.innerHTML = partes.join(' &nbsp;·&nbsp; ') +
                                ' &nbsp;<strong style="color:var(--accent)">' + total + '</strong>';
                            wrap2.style.display = 'block';
                        }
                        return;
                    } else if (ev.startsWith('+') && ev.includes('puntos')) {
                        toast.textContent = `✨ ${ev}`;
                    } else if (ev.startsWith('racha_')) {
                        const n = ev.replace('racha_', '');
                        toast.textContent = `🔥 ¡Racha de ${n}!`;
                    } else if (ev.startsWith('nivel_')) {
                        const n = ev.replace('nivel_', '');
                        toast.textContent = `⬆️ ¡Nivel ${n}!`;
                    } else {
                        toast.textContent = ev;
                    }
                    wrap.appendChild(toast);
                    setTimeout(() => toast.remove(), 2700);
                }, i * 400);
            });
        }

        function actualizarTopbar(gami) {
            document.getElementById('stat-puntos').textContent = gami.puntos || 0;
            const racha = gami.racha_actual || 0;
            const badge = document.getElementById('racha-badge');
            document.getElementById('racha-num').textContent = racha;
            badge.classList.toggle('off', racha === 0);
        }

        const CAT_COLORES = {1:'#f06292',2:'#ff9800',3:'#ffeb3b',4:'#4caf50',5:'#4fc3f7',6:'#7c6af7',7:'#e040fb',8:'#78909c'};

        function actualizarBKT(bkt) {
            const wrap = document.getElementById('bkt-rows');
            const cats = Object.keys(bkt).map(Number).sort();
            if (!cats.length) return;
            wrap.innerHTML = cats.map(c => {
                const v = bkt[c];
                const pct = Math.round(v.p_dominio * 100);
                const col = v.dominado ? 'var(--ok)' : (CAT_COLORES[c] || 'var(--accent)');
                return `<div class="bkt-row">
                    <span class="bkt-name" title="${v.nombre}">${v.nombre}</span>
                    <div class="bkt-bar-wrap"><div class="bkt-bar" style="width:${pct}%;background:${col}"></div></div>
                    <span class="bkt-pct">${pct}%</span>
                    <span class="bkt-dom">${v.dominado ? '✓' : ''}</span>
                </div>`;
            }).join('');
        }

        function mostrarFeedback(fb) {
            const panel = document.getElementById('feedback-panel');
            const pista = document.getElementById('feedback-pista');
            panel.classList.remove('ok', 'fail');
            panel.classList.add(fb.correcta ? 'ok' : 'fail', 'show');
            document.getElementById('feedback-titulo').textContent = fb.correcta ? '✓ Correcto' : '✗ Incorrecto';
            document.getElementById('feedback-texto').textContent = fb.explicacion || '';
            document.getElementById('feedback-motiv').textContent = fb.motivacion  || '';
            if (!fb.correcta && fb.pista) {
                pista.textContent = '💡 ' + fb.pista;
                pista.style.display = 'block';
            } else {
                pista.style.display = 'none';
            }
            document.getElementById('btn-siguiente').classList.add('show');
        }

        function marcarOpcion(correcta, respSeleccionada) {
            document.querySelectorAll('.option-btn').forEach((b, i) => {
                b.disabled = true;
                if (String(i) === respSeleccionada)
                    b.classList.add(correcta ? 'correct' : 'wrong');
            });
            const inp = document.getElementById('fill-input');
            if (inp && inp.type !== 'hidden') {
                inp.disabled = true;
                inp.classList.add(correcta ? 'correct' : 'wrong');
            }
            const btnH = document.getElementById('btn-hint');
            if (btnH) btnH.setAttribute('disabled', 'true');
        }

        function mostrarLoading(show) {
            document.getElementById('loading-state').style.display = show ? 'flex' : 'none';
            document.getElementById('ejercicio-content').style.display = show ? 'none' : 'block';
        }

        function mostrarFin(msg) {
            document.getElementById('ejercicio-content').innerHTML = `
                <div style="text-align:center;padding:48px 24px">
                    <div style="font-size:48px;margin-bottom:16px">🎉</div>
                    <div style="font-size:22px;font-weight:600;color:var(--accent);margin-bottom:8px">¡Completado!</div>
                    <div style="font-size:14px;color:var(--muted)">${msg || '¡Has respondido todas las preguntas!'}</div>
                    <button class="btn-sm" style="margin-top:24px;padding:10px 24px"
                            onclick="location.href='/'">Volver al inicio</button>
                </div>`;
            mostrarLoading(false);
        }

        function resaltarSintaxis(code) {
            const KW  = /\b(def|return|if|elif|else|for|while|in|not|and|or|import|from|class|pass|break|continue|True|False|None|global|lambda)\b/g;
            const FN  = /\b(print|input|range|len|int|float|str|list|dict|sum|append|extend|type|sorted|map|filter|enumerate|abs|max|min|round)\b/g;
            const NUM = /\b(\d+\.?\d*)\b/g;
            return code.split('\n').map(function(line) {
                var l = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                var comment = '';
                var ci = l.indexOf('#');
                if (ci !== -1) { comment = '<span class="cm">' + l.slice(ci) + '</span>'; l = l.slice(0, ci); }
                var strs = [];
                l = l.replace(/"[^"]*"|'[^']*'/g, function(m) {
                strs.push('<span class="str">' + m + '</span>');
                return 'STRPLACEHOLDER';
                });
                l = l.replace(KW, '<span class="kw">$1</span>');
                l = l.replace(FN, '<span class="fn">$1</span>');
                l = l.replace(NUM, '<span class="num">$1</span>');
                var idx = 0;
                l = l.replace(/STRPLACEHOLDER/g, function() { return strs[idx++]; });
                return l + comment;
            }).join('\n');
        }

        function resaltarHueco(html) {
            return html.replace(/___/g,
                '<span style="background:rgba(124,106,247,.25);color:var(--accent);' +
                'border-bottom:2px solid var(--accent);padding:0 4px;border-radius:3px;' +
                'font-weight:600">___</span>');
        }
    </script>
</body>
</html>

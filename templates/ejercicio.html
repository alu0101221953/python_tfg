<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;
        --accent:#7c6af7;--accent2:#4fc3f7;--ok:#4caf7d;--fail:#f06292;
        --text:#e8eaf0;--muted:#6b7080;
        --mono:'JetBrains Mono',monospace;--sans:'DM Sans',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);
        min-height:100vh;display:flex;flex-direction:column}
    
    /* Topbar */
    .topbar{display:flex;align-items:center;justify-content:space-between;
        padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
    .logo{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--accent)}
    .topbar-right{display:flex;align-items:center;gap:16px}
    .alumno-badge{background:var(--border);padding:4px 12px;border-radius:20px;
        font-size:13px;color:var(--muted)}
    .btn-sm{background:transparent;border:1px solid var(--border);color:var(--muted);
        padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;
        transition:all .2s;font-family:var(--sans)}
    .btn-sm:hover{border-color:var(--accent);color:var(--accent)}

    /* Layout */
    .main{flex:1;max-width:860px;margin:0 auto;width:100%;padding:28px 24px}
 
    /* Card */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px}
 
    /* Loading */
    .loading{display:flex;flex-direction:column;align-items:center;
            justify-content:center;min-height:200px;gap:12px}
    .spinner{width:32px;height:32px;border:2px solid var(--border);
            border-top-color:var(--accent);border-radius:50%;
            animation:spin .7s linear infinite}
    .loading-text{font-size:13px;color:var(--muted)}

    @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="topbar">
        <span class="logo">PyTutor</span>
        <div class="topbar-right">
            <span class="alumno-badge" id="alumno-nombre">Cargando...</span>
            <button class="btn-sm" onclick="location.href='/'">Salir</button>
        </div>
    </div>
    
    <div class="main">
        <div class="card">
            <div class="loading">
                <div class="spinner"></div>
                <div class="loading-text">Cargando ejercicio...</div>
            </div>
        </div>
    </div>    

    <script>
        const ID_ALUMNO = new URLSearchParams(location.search).get('id_alumno') || '';

        window.addEventListener('DOMContentLoaded', async () => {
            if (!ID_ALUMNO) { location.href = '/'; return; }
            await cargarPerfil();

        });

        async function cargarPerfil() {
            try {
                const res = await fetch(`/api/alumno/${ID_ALUMNO}`);
                if (!res.ok) { location.href = '/'; return; }
                const d = await res.json();
                document.getElementById('alumno-nombre').textContent = d.nombre;
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>

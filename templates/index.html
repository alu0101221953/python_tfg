<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;
        --accent:#7c6af7;--text:#e8eaf0;--muted:#6b7080;--fail:#f06292;
        --mono:'JetBrains Mono',monospace;--sans:'DM Sans',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;
        align-items:center;justify-content:center}
    .wrap{width:100%;max-width:420px;padding:24px}
    .logo{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--accent);margin-bottom:6px}
    .subtitle{font-size:14px;color:var(--muted);margin-bottom:36px;line-height:1.5}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px}
    .card-title{font-size:17px;font-weight:600;margin-bottom:22px}
    label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
    input{width:100%;background:#0a0c12;border:1px solid var(--border);border-radius:8px;padding:11px 14px;
        font-family:var(--sans);font-size:14px;color:var(--text);outline:none;margin-bottom:16px;transition:border-color .2s}
    input:focus{border-color:var(--accent)}
    .btn{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;
        font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
    .btn:hover{background:#6b59e8}
    .btn:disabled{opacity:.5;cursor:default}

    /* Divisor */
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0}
    .divider hr{flex:1;border:none;border-top:1px solid var(--border)}
    .divider span{font-size:12px;color:var(--muted)}

    /* Usuarios recientes */
    .alumno-item{display:flex;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
    .alumno-item:hover{border-color:var(--accent)}
    .alumno-item span{font-size:14px}
    .alumno-item small{font-size:11px;color:var(--muted)}
    .alumno-borrar{background:transparent;border:none;border-left:1px solid var(--border);padding:10px 14px;cursor:pointer;color:var(--muted);font-size:14px;transition:all .2s;flex-shrink:0}
    .alumno-borrar:hover{background:rgba(240,98,146,.1);color:var(--fail)}
    .alumno-confirm{display:none;background:rgba(240,98,146,.06);border:1px solid rgba(240,98,146,.2);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:13px}
    .alumno-confirm.show{display:block}
    .alumno-confirm p{color:var(--muted);margin-bottom:10px}
    .confirm-btns{display:flex;gap:8px}
    .btn-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--sans)}
    .btn-delete{background:transparent;border:1px solid var(--fail);color:var(--fail);padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--sans)}
    .btn-delete:hover{background:rgba(240,98,146,.1)}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo">TFG</div>
        <div class="subtitle">
            Sistema tutor inteligente para aprender Python básico.<br>
            Adaptado a tu ritmo de aprendizaje.
        </div>

        <div class="card">
            <div class="card-title">¿Cómo te llamas?</div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Ej: Víctor" autofocus
                   oninput="document.getElementById('btn-empezar').disabled = !this.value.trim()"
                   onkeydown="if(event.key==='Enter') empezar()">
            <button class="btn" id="btn-empezar" onclick="empezar()" disabled>Empezar →</button>

            <div id="recientes-wrap" style="display:none">
                <div class="divider">
                    <hr><span>O continuar como</span><hr>
                </div>
                <div id="alumnos-list"></div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', cargarRecientes);

        function cargarRecientes() {
            const recientes = JSON.parse(localStorage.getItem('TFG_recientes') || '[]');
            if (!recientes.length) return;
            document.getElementById('recientes-wrap').style.display = 'block';
            document.getElementById('alumnos-list').innerHTML = recientes.slice(0, 5).map((a, i) => `
                <div class="alumno-item" id="item-${i}">
                    <div style="flex:1;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer" onclick="continuar('${a.id}', '${a.nombre}')">
                        <span>${a.nombre}</span>
                        <small>Continuar →</small>
                    </div>
                    <button class="alumno-borrar" onclick="pedirConfirm(event, ${i}, '${a.id}', '${a.nombre}')" title="Borrar cuenta">🗑</button>
                </div>
                <div class="alumno-confirm" id="confirm-${i}">
                    <p>¿Borrar la cuenta de <strong>${a.nombre}</strong> y todo su progreso?</p>
                    <div class="confirm-btns">
                        <button class="btn-cancel" onclick="cancelarConfirm(${i})">Cancelar</button>
                        <button class="btn-delete" onclick="borrarCuenta('${a.id}', ${i})">Sí, borrar</button>
                    </div>
                </div>
            `).join('');
        }

        function pedirConfirm(e, i, id, nombre) {
            e.stopPropagation();
            document.querySelectorAll('.alumno-confirm.show').forEach(el => el.classList.remove('show'));
            document.getElementById(`confirm-${i}`).classList.add('show');
        }

        function cancelarConfirm(i) {
            document.getElementById(`confirm-${i}`).classList.remove('show');
        }

        async function borrarCuenta(id, i) {
            try { await fetch(`/api/alumno/${id}`, { method: 'DELETE' }); } catch(e) {}
            let recientes = JSON.parse(localStorage.getItem('TFG_recientes') || '[]');
            recientes = recientes.filter(a => a.id !== id);
            localStorage.setItem('TFG_recientes', JSON.stringify(recientes));
            cargarRecientes();
            if (!recientes.length) document.getElementById('recientes-wrap').style.display = 'none';
        }

        async function continuar(id, nombre) {
            guardarReciente(id, nombre);
            try {
                const res = await fetch(`/api/alumno/iniciar?nombre=${encodeURIComponent(nombre)}&id_alumno=${encodeURIComponent(id)}`,
                 { method: 'POST' });
                const d   = await res.json();
                location.href = `/ejercicio?id_alumno=${d.id_alumno}`;
            } catch(e) {
                location.href = `/ejercicio?id_alumno=${id}`;
            }
        }

        async function empezar() {
            const nombre = document.getElementById('nombre').value.trim();
            if (!nombre) return;
            document.getElementById('btn-empezar').disabled = true;
            try {
                const res = await fetch(`/api/alumno/iniciar?nombre=${encodeURIComponent(nombre)}`, { method: 'POST' });
                const d   = await res.json();
                guardarReciente(d.id_alumno, d.nombre);
                location.href = `/ejercicio?id_alumno=${d.id_alumno}`;
            } catch(e) {
                document.getElementById('btn-empezar').disabled = false;
            }
        }

        function guardarReciente(id, nombre) {
            let recientes = JSON.parse(localStorage.getItem('TFG_recientes') || '[]');
            recientes = recientes.filter(a => a.id !== id);
            recientes.unshift({ id, nombre });
            localStorage.setItem('TFG_recientes', JSON.stringify(recientes.slice(0, 5)));
        }
    </script>
</body>
</html>

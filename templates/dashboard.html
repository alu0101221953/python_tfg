<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyTutor - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
    :root {
        --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;
        --accent:#7c6af7;--accent2:#4fc3f7;--ok:#4caf7d;--fail:#f06292;
        --text:#e8eaf0;--muted:#6b7080;
        --mono:'JetBrains Mono',monospace;--sans:'DM Sans',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}

    /* Topbar */
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
    .logo{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--accent)}
    .topbar-right{display:flex;align-items:center;gap:16px}
    .alumno-badge{background:var(--border);padding:4px 12px;border-radius:20px;font-size:13px;color:var(--muted)}
    .btn-sm{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s;font-family:var(--sans)}
    .btn-sm:hover{border-color:var(--accent);color:var(--accent)}

    /* Layout */
    .main{flex:1;max-width:1000px;margin:0 auto;width:100%;padding:28px 24px}

    /* Métricas */
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
    .metric-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px}
    .metric-val{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--accent);margin-bottom:4px}
    .metric-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

    /* Sección genérica */
    .section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
    .section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:16px}

    /* Feedback IA */
    .feedback-ia{background:linear-gradient(135deg,rgba(124,106,247,.08),rgba(79,195,247,.05));border:1px solid rgba(124,106,247,.25);border-radius:12px;padding:24px;margin-bottom:20px}
    .feedback-texto{font-size:14px;line-height:1.75;color:var(--text);white-space:pre-wrap}
    .feedback-fuente{font-size:11px;color:var(--muted);margin-top:10px}
    .feedback-loading{font-size:13px;color:var(--muted);font-style:italic}
    .btn-refresh{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;margin-left:8px;font-family:var(--sans)}
    .btn-refresh:hover{border-color:var(--accent);color:var(--accent)}

    /* Loading */
    .loading{display:flex;align-items:center;justify-content:center;min-height:200px;gap:12px;flex-direction:column}
    .spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>

    <div class="topbar">
        <span class="logo">TFG</span>
        <div class="topbar-right">
            <span class="alumno-badge" id="alumno-nombre">Cargando...</span>
            <button class="btn-sm" onclick="window.open('/api/dashboard/'+ID_ALUMNO+'/pdf', '_blank')">Descargar informe</button>
            <button class="btn-sm" onclick="location.href='/ejercicio?id_alumno='+ID_ALUMNO">Practicar</button>
            <button class="btn-sm" onclick="location.href='/'">Salir</button>
        </div>
    </div>

    <div class="main">
        <div class="loading" id="loading-state">
            <div class="spinner"></div>
            <div style="font-size:13px;color:var(--muted)">Cargando diagnóstico...</div>
        </div>
        <div id="dashboard-content" style="display:none">
            <div class="metrics">
                <div class="metric-card">
                    <div class="metric-val" id="m-intentos">—</div>
                    <div class="metric-lbl">Ejercicios</div>
                </div>
                <div class="metric-card">
                    <div class="metric-val" id="m-precision">—</div>
                    <div class="metric-lbl">Precisión</div>
                </div>
                <div class="metric-card">
                    <div class="metric-val" id="m-puntos">—</div>
                    <div class="metric-lbl">Puntos</div>
                </div>
                <div class="metric-card">
                    <div class="metric-val" id="m-nivel">—</div>
                    <div class="metric-lbl">Nivel</div>
                </div>
            </div>
            <div class="feedback-ia section">
                <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
                    <span>Resumen de tu perfil</span>
                    <button class="btn-refresh" onclick="cargarFeedback(true)">↻ Actualizar</button>
                </div>
                <div id="feedback-content">
                    <div class="feedback-loading">Generando análisis personalizado...</div>
                </div>
            </div>
            <div class="section">
                <div class="section-title">Progreso por categoría</div>
                <div id="bkt-content"></div>
            </div>
        </div>
            <div class="section">
                <div class="section-title">Evolución temporal</div>
                <div id="evolucion-empty" style="display:none;font-size:13px;color:var(--muted)">
                    Aún no hay suficientes datos para mostrar la evolución.
                </div>
                <canvas id="chart-evolucion" height="100"></canvas>
            </div>
            <div class="section">
                <div class="section-title">Insignias</div>
                <div id="insignias-content"></div>
            </div>
        </div>
    </div>

    <script>
        const ID_ALUMNO = new URLSearchParams(location.search).get('id_alumno') || '';

        window.addEventListener('DOMContentLoaded', async () => {
            if (!ID_ALUMNO) { location.href = '/'; return; }
            await cargarDashboard();
        });

        async function cargarDashboard() {
            try {
                const res = await fetch(`/api/dashboard/${ID_ALUMNO}`);
                if (!res.ok) { location.href = '/'; return; }
                const data = await res.json();
                renderizarDashboard(data);
            } catch(e) { console.error(e); }
        }

        async function cargarFeedback(forzar = false) {
            const wrap = document.getElementById('feedback-content');
            wrap.innerHTML = '<div class="feedback-loading">Generando análisis personalizado...</div>';
            try {
                const url = `/api/dashboard/${ID_ALUMNO}/feedback${forzar ? '?v=' + Date.now() : ''}`;
                const res  = await fetch(url);
                const data = await res.json();
                const fuente = data.fuente === 'llm' ? 'Generado con IA' :
                               data.fuente === 'cache' ? 'Desde caché' : 'Plantilla (sin API key)';
                wrap.innerHTML = `
                    <div class="feedback-texto">${data.feedback}</div>
                    <div class="feedback-fuente">${fuente}${data.error ? ' · ' + data.error : ''}</div>
                `;
            } catch(e) {
                wrap.innerHTML = '<div class="feedback-loading">No se pudo generar el análisis.</div>';
            }
        }

        function renderizarDashboard(data) {
            document.getElementById('alumno-nombre').textContent = data.nombre;

            // Métricas
            document.getElementById('m-intentos').textContent = data.stats.intentos;
            document.getElementById('m-precision').textContent = data.stats.precision + '%';
            document.getElementById('m-puntos').textContent = data.gamificacion.puntos;
            document.getElementById('m-nivel').textContent = 'Nv. ' + data.gamificacion.nivel;

            // BKT
            renderizarBKT(data.bkt);

            // Evolución
            renderizarEvolucion(data.evolucion || []);

            // Insignias
            renderizarInsignias(data.gamificacion?.insignias || []);

            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';
            cargarFeedback();
        }

        let chartEvolucion = null;

        function renderizarEvolucion(evolucion) {
            if (evolucion.length < 2) {
                document.getElementById('evolucion-empty').style.display = 'block';
                document.getElementById('chart-evolucion').style.display = 'none';
                return;
            }
            const labels = evolucion.map(e => e.dia);
            const precision = evolucion.map(e => e.precision);
            const intentos = evolucion.map(e => e.intentos);

            if (chartEvolucion) chartEvolucion.destroy();
            chartEvolucion = new Chart(document.getElementById('chart-evolucion'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Precisión (%)',
                            data: precision,
                            borderColor: '#7c6af7',
                            backgroundColor: 'rgba(124,106,247,.1)',
                            tension: .3,
                            fill: true,
                            yAxisID: 'y',
                        },
                        {
                            label: 'Ejercicios',
                            data: intentos,
                            borderColor: '#4fc3f7',
                            backgroundColor: 'transparent',
                            tension: .3,
                            borderDash: [4, 4],
                            yAxisID: 'y1',
                        },
                    ],
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { labels: { color: '#6b7080', font: { family: 'DM Sans' } } } },
                    scales: {
                        x: { ticks: { color: '#6b7080' }, grid: { color: '#2a2d3a' } },
                        y: { min: 0, max: 100, ticks: { color: '#6b7080', callback: v => v + '%' }, grid: { color: '#2a2d3a' }, position: 'left' },
                        y1: { min: 0, ticks: { color: '#4fc3f7' }, grid: { display: false }, position: 'right' },
                    },
                },
            });
        }

        const INSIGNIA_DEF = {
            'primer_acierto': { icon: '🏅', nombre: 'Primer acierto', desc: 'Primera respuesta correcta' },
            'racha_3': { icon: '🔥', nombre: 'Racha de 3', desc: '3 aciertos consecutivos' },
            'racha_5': { icon: '🔥', nombre: 'Racha de 5', desc: '5 aciertos consecutivos' },
            'racha_10': { icon: '🔥', nombre: 'Racha de 10', desc: '10 aciertos consecutivos' },
            'nivel_2': { icon: '⬆️', nombre: 'Nivel 2', desc: 'Alcanzar el nivel 2' },
            'nivel_5': { icon: '⬆️', nombre: 'Nivel 5', desc: 'Alcanzar el nivel 5' },
            'nivel_10': { icon: '⬆️', nombre: 'Nivel 10', desc: 'Alcanzar el nivel 10' },
            '10_correctas': { icon: '✅', nombre: '10 correctas',    desc: '10 respuestas correctas' },
            'sin_pistas_5': { icon: '🧠', nombre: 'Sin pistas x5',   desc: '5 aciertos seguidos sin usar pistas' },
            'velocista_3': { icon: '⚡', nombre: 'Velocista',        desc: '3 respuestas rápidas seguidas' },
            'perseverante_3':{ icon: '💪', nombre: 'Perseverante',     desc: '3 aciertos seguidos en categorías difíciles' },
            '25_correctas': { icon: '✅', nombre: '25 correctas', desc: '25 respuestas correctas' },
            '50_correctas': { icon: '✅', nombre: '50 correctas', desc: '50 respuestas correctas' },
        };
        const CAT_NOMBRES_INS = {1:'Sintaxis',2:'Indentación',3:'Variables',4:'Condicionales',5:'Bucles',6:'Funciones',7:'Listas',8:'Otros'};

        function renderizarInsignias(insignias) {
            const wrap = document.getElementById('insignias-content');
            if (!insignias.length) {
                wrap.innerHTML = '<p style="font-size:13px;color:var(--muted)">Aún no has desbloqueado ninguna insignia. ¡Sigue practicando!</p>';
                return;
            }
            wrap.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:12px">
                ${insignias.map(ins => {
                    const cat = ins.match(/domina_cat_(\d+)/);
                    const def = cat
                        ? { icon: '🏆', nombre: `Dominas ${CAT_NOMBRES_INS[cat[1]] || 'categoría'}`, desc: 'Categoría dominada' }
                        : (INSIGNIA_DEF[ins] || { icon: '🏅', nombre: ins, desc: '' });
                    return `<div style="background:rgba(255,213,79,.06);border:1px solid rgba(255,213,79,.2);border-radius:10px;padding:14px 18px;text-align:center;min-width:110px">
                        <div style="font-size:28px;margin-bottom:6px">${def.icon}</div>
                        <div style="font-size:12px;font-weight:600;color:#ffd54f">${def.nombre}</div>
                        <div style="font-size:11px;color:var(--muted);margin-top:2px">${def.desc}</div>
                    </div>`;
                }).join('')}
            </div>`;
        }

        const CAT_COLORES = {1:'#f06292',2:'#ff9800',3:'#ffeb3b',4:'#4caf50',5:'#4fc3f7',6:'#7c6af7',7:'#e040fb',8:'#78909c'};

        function renderizarBKT(bkt) {
            const cats = Object.keys(bkt).map(Number).sort();
            if (!cats.length) {
                document.getElementById('bkt-content').innerHTML =
                    '<p style="color:var(--muted);font-size:13px">Aún no hay datos de progreso.</p>';
                return;
            }
            document.getElementById('bkt-content').innerHTML = cats.map(c => {
                const v = bkt[c];
                const pct = Math.round(v.p_dominio * 100);
                const col = v.dominado ? 'var(--ok)' : (CAT_COLORES[c] || 'var(--accent)');
                return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
                    <span style="width:100px;font-size:13px;color:var(--text)">${v.nombre}</span>
                    <div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden">
                        <div style="width:${pct}%;height:100%;background:${col};border-radius:4px;transition:width .5s ease"></div>
                    </div>
                    <span style="font-family:var(--mono);font-size:12px;color:var(--muted);width:36px;text-align:right">${pct}%</span>
                    <span style="font-size:12px;color:var(--ok);width:14px">${v.dominado ? '✓' : ''}</span>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
